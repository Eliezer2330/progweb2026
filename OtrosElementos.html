<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <select name="pais" id="pais">
        <option value="default">Pais Favorito</option>
        <option value="30">Brasil</option>
        <option value="40">Canada</option>
        <option value="50">Mexico</option>
        <option value="60">EU</option>
    </select>

    <p>Que color es tu favorito?</p>
    <input type="radio" name="color1" value="red"> Rojo
    <input type="radio" name="color1" value="blue"> Azul
    <input type="radio" name="color1" value="green"> Verde

    <p>Cuales son tus colores favoritos?</p>
    <input type="checkbox" name="color2" value="red"> Rojo
    <input type="checkbox" name="color2" value="blue"> Azul
    <input type="checkbox" name="color2" value="green"> Verde
    
    <p>Cual es tu fecha de nacimiento?</p>
    <input type="date" name="fechaNacimiento">

    <p>Coloca tu color favorito</p>
    <input type="color" name="colorFavorito">

    <p>Coloca una foto</p>
    <input type="file" name="foto">

</body>
</html>
