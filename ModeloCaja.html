<!DOCTYPE html>
<html lang="es">
<head>
<style>
  .caja-ejemplo {
    box-sizing: border-box; 
    width: 1000px;
    height: 500px;
    padding: 10px;
    border: 10px solid #000000;
    margin: 30px;
    background-color: rgb(234, 123, 123);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-content: flex-start;
    box-sizing: border-box;
  }

  .contenedor{
    width: 220px;
    height: 150px;
    border: 5px solid #000000;
    margin: 10px;
    background-color: rgb(95, 110, 230);
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    
  }
  
</style>
</head>
<body> 
<div class="caja-ejemplo">
<div class="contenedor">Contenedor 1</div>
<div class="contenedor">Contenedor 2</div>
<div class="contenedor">Contenedor 3</div>
<div class="contenedor">Contenedor 4</div>
<div class="contenedor">Contenedor 5</div>
</div>

</body>
</html>
